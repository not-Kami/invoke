<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Main dice -->
  <g transform="translate(32, 32)">
    <!-- Dice shadow -->
    <rect x="-12" y="-8" width="24" height="24" rx="3" fill="#000000" opacity="0.2" transform="translate(1, 1)"/>
    
    <!-- Main dice -->
    <rect x="-12" y="-8" width="24" height="24" rx="3" fill="url(#diceGradient)"/>
    
    <!-- Dice dots -->
    <g fill="white" opacity="0.9">
      <!-- Top row -->
      <circle cx="-8" cy="-6" r="1.5"/>
      <circle cx="0" cy="-6" r="1.5"/>
      <circle cx="8" cy="-6" r="1.5"/>
      
      <!-- Middle row -->
      <circle cx="-8" cy="0" r="1.5"/>
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="8" cy="0" r="1.5"/>
      
      <!-- Bottom row -->
      <circle cx="-8" cy="6" r="1.5"/>
      <circle cx="0" cy="6" r="1.5"/>
      <circle cx="8" cy="6" r="1.5"/>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="12" cy="12" r="1" fill="white" opacity="0.4"/>
  <circle cx="52" cy="16" r="1" fill="white" opacity="0.3"/>
  <circle cx="48" cy="48" r="1.5" fill="white" opacity="0.2"/>
  <circle cx="16" cy="52" r="1" fill="white" opacity="0.3"/>
</svg>